; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/en/stable/projectconf.html
;
; *********************************************************************
; *** Selection of Tasmota build variant is done with VSC
; *** alternatively can be done in: platformio_override.ini
; *** See example: platformio_override_sample.ini
; *********************************************************************

[platformio]
description                     = Provide ESP32 based devices with Web, MQTT and OTA firmware
src_dir                         = tasmota
lib_dir                         = lib/default
boards_dir                      = boards
build_cache_dir                 = .cache
default_envs                    = HEXAOS_P4

[esp32_defaults]
lib_archive                     = no
shared_libdeps_dir              = lib
board_build.littlefs_version    = 2.0
;platform                    = https://github.com/tasmota/platform-espressif32/releases/download/2026.01.30/platform-espressif32.zip
;platform                    = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF55_gcc152
platform                    = ./platform/platform-espressif32-Arduino-IDF55_gcc152_12_02_2026.zip
platform_packages           = 
framework                   = arduino
board                       = esp32
board_build.filesystem      = littlefs
board_build.variants_dir    = variants/tasmota
custom_unpack_dir           = unpacked_littlefs
monitor_speed               = 115200
monitor_echo                = yes
upload_resetmethod          = nodemcu
check_skip_packages         = yes
lib_ldf_mode                = chain
lib_compat_mode             = strict
lib_extra_dirs              = lib/lib_hexaos
                              lib/lib_basic
                              lib/lib_i2c
                              lib/lib_display
                              lib/lib_ssl
                              lib/lib_rf
                              lib/lib_div
                              lib/libesp32
                              lib/libesp32_lvgl
build_unflags               = -Wall
                              -Wdeprecated-declarations
                              -mtarget-align
                              -Wswitch-unreachable
                              -Wstringop-overflow
                              -Wincompatible-pointer-types
                              -Wnonnull-compare
                              -fexceptions
                              -Wpointer-arith
build_flags                 = -DCORE_DEBUG_LEVEL=0
                              -Wl,-Map,firmware.map
                              -Wno-deprecated-declarations
                              -mtarget-align
                              -free
                              -fipa-pta
                              -Wreturn-type
                              -DTASMOTA  ; flag indicating that we are compiling Tasmota
                              -DUSE_CONFIG_OVERRIDE
                              -DUSE_IPV6
                              -mno-target-align
                              -Wno-switch-unreachable
                              -Wno-stringop-overflow
                              -fno-exceptions
                              -ffunction-sections
                              -fdata-sections
                              -Wl,--gc-sections
                              -DBUFFER_LENGTH=128
                              -DHTTP_UPLOAD_BUFLEN=2048
                              -DMQTT_MAX_PACKET_SIZE=1200
                              -Duint32=uint32_t
                              -Duint16=uint16_t
                              -Duint8=uint8_t
                              -Dsint8_t=int8_t
                              -Dsint32_t=int32_t
                              -Dsint16_t=int16_t
                              -Dmemcpy_P=memcpy
                              -Dmemcmp_P=memcmp
                              -DUSE_SHA_ROM
                              ;for TLS we can afford compiling for 4K RSA keys
                              -DUSE_4K_RSA
                              -I$PROJECT_DIR/include
                              -include "sdkconfig.h"
                              -include "esp32x_fixes.h"
                              ; wrappers for the crash-recorder
                              -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
                              -Wl,--wrap=_Z11analogWritehi  ; `analogWrite(unsigned char, int)` use the Tasmota version of analogWrite for deeper integration and phase control
                              -Wl,--wrap=ledcReadFreq       ; `uint32_t ledcReadFreq(uint8_t chan)`
                              -Wl,--wrap=delay              ; void delay(uint32_t ms)
lib_ignore                  =
                              HTTPUpdateServer
                              USB
                              NetBIOS
                              Preferences
                              ArduinoOTA
extra_scripts               = pre:pio-tools/add_c_flags.py
                              pre:pio-tools/solidify-from-url.py
                              pre:pio-tools/gen-berry-structures.py
                              post:pio-tools/post_esp32.py
                              pre:pio-tools/pre_source_dir.py
                              pre:pio-tools/set_partition_table.py
                              pre:pio-tools/override_copy.py
                              pre:pio-tools/compress-html.py
                              pre:pio-tools/port-vsc.py
                              post:pio-tools/strip-flags.py
monitor_filters             = esp32_exception_decoder
custom_files_upload         = no_files
 

[env:ESP32]
framework               = ${esp32_defaults.framework}
platform                = ${esp32_defaults.platform}
platform_packages       = ${esp32_defaults.platform_packages}
board_build.filesystem  = ${esp32_defaults.board_build.filesystem}
custom_unpack_dir       = ${esp32_defaults.custom_unpack_dir}
board_build.variants_dir = ${esp32_defaults.board_build.variants_dir}
board                   = ${esp32_defaults.board}
monitor_speed           = ${esp32_defaults.monitor_speed}
monitor_echo            = ${esp32_defaults.monitor_echo}
upload_resetmethod      = ${esp32_defaults.upload_resetmethod}
check_skip_packages     = ${esp32_defaults.check_skip_packages}
extra_scripts           = ${esp32_defaults.extra_scripts}
monitor_filters         = ${esp32_defaults.monitor_filters}
build_unflags           = ${esp32_defaults.build_unflags}
build_flags             = ${esp32_defaults.build_flags}
lib_ldf_mode            = ${esp32_defaults.lib_ldf_mode}
lib_compat_mode         = ${esp32_defaults.lib_compat_mode}
lib_extra_dirs          = ${esp32_defaults.lib_extra_dirs}
lib_ignore              = ${esp32_defaults.lib_ignore}

[env:HEXAOS_P4-safeboot]
extends                     = env:ESP32
board                       = HEXAOS_P4
board_build.app_partition_name = safeboot
build_flags                 = ${env:ESP32.build_flags}
                            -DFIRMWARE_SAFEBOOT
                            -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32p4-safeboot.bin"'
lib_extra_dirs              = lib/lib_ssl, lib/libesp32
lib_ignore                  = ESPmDNS
