; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/en/stable/projectconf.html
;
; *********************************************************************
; *** Selection of Tasmota build variant is done with VSC
; *** alternatively can be done in: platformio_override.ini
; *** See example: platformio_override_sample.ini
; *********************************************************************

[platformio]
description                 = Provide ESP8266 / ESP32 based devices with Web, MQTT and OTA firmware
src_dir                     = tasmota
lib_dir                     = lib/default
boards_dir                  = boards
build_cache_dir             = .cache
extra_configs               = platformio_hexaos.ini





[common]
platform                    = ${core.platform}
platform_packages           = ${core.platform_packages}
framework                   = arduino
board                       = esp8266_1M
board_build.filesystem      = littlefs
board_build.littlefs_version = 2.0
board_build.variants_dir    = variants/tasmota
custom_unpack_dir           = unpacked_littlefs
build_unflags               = ${core.build_unflags}
build_flags                 = ${core.build_flags}
monitor_speed               = 115200
monitor_echo                = yes
; *** Upload Serial reset method for Wemos and NodeMCU 
upload_resetmethod          = nodemcu
check_skip_packages         = yes
extra_scripts               = ${esp_defaults.extra_scripts}
lib_archive                 = no
lib_ldf_mode                = chain
lib_compat_mode             = strict
shared_libdeps_dir          = lib
lib_extra_dirs              =
                              lib/lib_basic
                              lib/lib_i2c
                              lib/lib_display
                              lib/lib_ssl
 ;                             lib/lib_audio
                              lib/lib_rf
                              lib/lib_div

                        
[scripts_defaults]
extra_scripts               = pre:pio-tools/pre_source_dir.py
                              pre:pio-tools/set_partition_table.py
                              pre:pio-tools/override_copy.py
                              pre:pio-tools/compress-html.py
                              pre:pio-tools/port-vsc.py
                              post:pio-tools/strip-flags.py

[esp_defaults]
extra_scripts               = post:pio-tools/name-firmware.py
                              post:pio-tools/gzip-firmware.py
                              post:pio-tools/metrics-firmware.py
                              pre:pio-tools/custom_target.py
;                              post:pio-tools/obj-dump.py
                              ${scripts_defaults.extra_scripts}
; *** remove undesired all warnings
build_unflags               = -Wall
                              -Wdeprecated-declarations
build_flags                 = -DCORE_DEBUG_LEVEL=0
                              -Wl,-Map,firmware.map
                              -Wno-deprecated-declarations
;                              -free
;                              -fipa-pta
                              -Wreturn-type
                              -DTASMOTA  ; flag indicating that we are compiling Tasmota
; *********************************************************************
; *** Use custom settings from file user_config_override.h
                              -DUSE_CONFIG_OVERRIDE
; *********************************************************************


; ***              ESP32 Tasmota version                 ***

[esp82xx_defaults]
extra_scripts               = ${esp_defaults.extra_scripts}
build_flags                 = ${esp_defaults.build_flags}
                              -DNDEBUG
                              -DFP_IN_IROM
                              -DBEARSSL_SSL_BASIC
                              ; NONOSDK22x_190703 = 2.2.2-dev(38a443e)
                              -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22x_190703
                              -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH_LOW_FLASH
                              ; -DPIO_FRAMEWORK_ARDUINO_LWIP2_IPV6_HIGHER_BANDWIDTH -DUSE_IPV6 ; enables IPv6
                              ; VTABLES in Flash
                              -DVTABLES_IN_FLASH
                              ; remove the 4-bytes alignment for PSTR()
                              -DPSTR_ALIGN=1
                              ; restrict to minimal mime-types
                              -DMIMETYPE_MINIMAL
                              ; uncomment the following to enable TLS with 4096 RSA certificates
                              ;-DUSE_4K_RSA

[esp32_defaults]
build_unflags               = ${esp_defaults.build_unflags}
                              -Wswitch-unreachable
                              -Wincompatible-pointer-types
                              -Wnonnull-compare
                              -fexceptions
                              -Wpointer-arith
build_flags                 = ${esp_defaults.build_flags}
                              ; comment next line to disable IPv6 support
                              -DUSE_IPV6
                              -Wno-switch-unreachable
                              -fno-exceptions
;                              -ffunction-sections
                              -fdata-sections
                              -Wl,--gc-sections
                              -DBUFFER_LENGTH=128
                              -DHTTP_UPLOAD_BUFLEN=2048
                              -DMQTT_MAX_PACKET_SIZE=1200
                              -Duint32=uint32_t
                              -Duint16=uint16_t
                              -Duint8=uint8_t
                              -Dsint8_t=int8_t
                              -Dsint32_t=int32_t
                              -Dsint16_t=int16_t
                              -Dmemcpy_P=memcpy
                              -Dmemcmp_P=memcmp
                              -DUSE_SHA_ROM
                              ;for TLS we can afford compiling for 4K RSA keys
                              -DUSE_4K_RSA
                              -I$PROJECT_DIR/include
                              -include "sdkconfig.h"
                              -include "esp32x_fixes.h"
                              ; wrappers for the crash-recorder
;                              -Wl,--wrap=panicHandler -Wl,--wrap=xt_unhandled_exception
                              -Wl,--wrap=_Z11analogWritehi  ; `analogWrite(unsigned char, int)` use the Tasmota version of analogWrite for deeper integration and phase control
                              -Wl,--wrap=ledcReadFreq       ; `uint32_t ledcReadFreq(uint8_t chan)`
                              -Wl,--wrap=delay              ; void delay(uint32_t ms)
lib_ignore                  =
                              HTTPUpdateServer
                              USB
                              NetBIOS
                              Preferences
                              ArduinoOTA
extra_scripts               = pre:pio-tools/add_c_flags.py
                              pre:pio-tools/solidify-from-url.py
                              pre:pio-tools/gen-berry-structures.py
                              post:pio-tools/post_esp32.py
                              ${esp_defaults.extra_scripts}
monitor_filters             = esp32_exception_decoder


[safeboot_flags]
lib_ignore                  = ${esp32_defaults.lib_ignore}
                              ESPmDNS
                              LinkedList
                              LittleFS
                              ESP Mail Client
                              IRremoteESP8266
                              NeoPixelBus
                              OneWire
                              EEPROM
                              EEPROM 24C128_256_521
                              MFRC522
                              JPEGDEC
                              universal display Library
                              ESP8266Audio
                              ESP8266SAM
                              FFat
                              SD
                              SD_MMC
                              UdpListener
                              esp_wireguard_tasmota
                              IniFile
                              Berry
                              Berry mapping to C
                              Berry Tasmota mapping
                              Berry int64 implementation for 32 bits architecture
                              Berry Matter protocol implementation
                              Berry animation library for WS2812 leds
                              Berry Animation Framework
                              Berry custom template
                              Micro-RTSP
                              re1.5
                              DHT sensor library
                              ccronexpr
                              TasmotaDali
custom_component_remove     =
                              espressif/network_provisioning
                              espressif/esp_modem
                              espressif/esp-dsp
                              espressif/esp32-camera
                              espressif/mdns
                              espressif/esp_jpg
                              espressif/fb_gfx
                              espressif/cmake_utilities

[core32]
;platform                    = https://github.com/tasmota/platform-espressif32/releases/download/2026.01.30/platform-espressif32.zip
;platform                    = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF55_gcc152
;platform                     = https://github.com/tasmota/platform-espressif32/releases/download/2026.02.30/platform-espressif32.zip
;platform                     = ./platform/platform-espressif32-Arduino-IDF55_gcc152_18_02_2026.zip
platform                     = ./platform/platform-espressif32-Arduino-IDF55_gcc152_19_02_2026_15.zip
platform_packages           =
build_unflags               = ${esp32_defaults.build_unflags}
build_flags                 = ${esp32_defaults.build_flags}

[core]
; *** Esp8266 Tasmota modified Arduino core based on core 2.7.4. Added Backport for PWM selection
platform                    = https://github.com/tasmota/platform-espressif8266/releases/download/2026.01.00/platform-espressif8266.zip
platform_packages           =
build_unflags               = ${esp_defaults.build_unflags}
build_flags                 = ${esp82xx_defaults.build_flags}
; *** Use ONE of the two PWM variants. Tasmota default is Locked PWM
                              ;-DWAVEFORM_LOCKED_PHASE
                              -DWAVEFORM_LOCKED_PWM





